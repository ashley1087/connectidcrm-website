<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're in — The Handshake Business</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #FF1744;
      --brand-gradient: linear-gradient(135deg, #FA5E36, #EB3656);
      --off-white: #FAF9F8;
      --gray-200: #F0EFEE;
      --gray-600: #6c757d;
      --text: #1a1a1a;
      --radius: 10px;
    }
    body {
      font-family: 'Poppins', -apple-system, sans-serif;
      font-size: 16px;
      color: var(--text);
      background: #fff;
      -webkit-font-smoothing: antialiased;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 24px 60px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
    }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.8px;
      line-height: 1.15;
      margin-bottom: 14px;
    }
    p {
      font-size: 15px;
      color: var(--gray-600);
      line-height: 1.65;
      margin-bottom: 32px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 56px;
      padding: 16px 24px;
      background: var(--brand-gradient);
      color: white;
      text-decoration: none;
      border-radius: var(--radius);
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 700;
      transition: all .18s ease;
      margin-bottom: 16px;
    }
    .back-btn:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(235,54,86,0.35); }
    .secondary-link {
      font-size: 13px;
      color: var(--gray-600);
      text-decoration: none;
    }
    .secondary-link:hover { color: var(--orange); }
  </style>
</head>
<body>
  <div class="icon">🎙</div>
  <h1>You're in — we'll be in touch.</h1>
  <p>
    Ashley reviews guest applications personally. Expect a message within a few days
    to schedule your conversation. No pitch. Just a real talk about what's working
    in your business right now.
  </p>
  <a href="/ig.html" class="back-btn">← Back to links</a>
  <a href="https://connectidcrm.com" class="secondary-link">Learn more about Connectid →</a>
</body>
</html>
