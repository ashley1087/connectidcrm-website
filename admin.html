<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intake Admin | Connectid</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #111111; --navy2: #1a1a1a;
      --red: #EC3857; --orange: #FF1744;
      --brand-gradient: linear-gradient(135deg, #FA5E36, #EC3857);
      --white: #fff; --gray-100: #FAF9F8; --gray-200: #F0EFEE;
      --gray-300: #E5E4E2; --gray-400: #adb5bd; --gray-600: #6c757d;
      --green: #16a34a;
      --text: #1a1a1a;
      --shadow-lg: 0 12px 48px rgba(0,0,0,0.10);
    }
    body { font-family: 'Poppins', -apple-system, sans-serif; color: var(--text); background: var(--gray-100); font-size: 15px; line-height: 1.6; }

    /* Header */
    header.top { background: var(--navy); padding: 18px 24px; }
    .top-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .top-logo img { height: 28px; display: block; }
    .top-right { display: flex; align-items: center; gap: 16px; color: rgba(255,255,255,0.6); font-size: 13px; }
    .top-right a { color: var(--orange); text-decoration: none; }

    /* Sign-in */
    .signin-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .signin-card { background: white; border-radius: 14px; box-shadow: var(--shadow-lg); padding: 44px; max-width: 440px; width: 100%; }
    .signin-card h1 { font-size: 24px; font-weight: 900; letter-spacing: -0.4px; margin-bottom: 8px; }
    .signin-card p { color: var(--gray-600); margin-bottom: 28px; font-size: 14px; }

    /* Forms */
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
    .field input { width: 100%; padding: 11px 13px; border: 1.5px solid var(--gray-300); border-radius: 7px; font-family: inherit; font-size: 14px; }
    .field input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(236,56,87,0.12); }

    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 7px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; transition: all .15s; }
    .btn-primary { background: var(--brand-gradient); color: white; }
    .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-sm { padding: 7px 14px; font-size: 12px; }
    .btn-ghost { background: var(--gray-100); color: var(--navy); border: 1px solid var(--gray-300); }
    .btn-ghost:hover { background: var(--gray-200); }
    .btn-block { width: 100%; justify-content: center; }

    .notice { padding: 12px 14px; border-radius: 7px; font-size: 13px; margin-bottom: 16px; }
    .notice.ok { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .notice.err { background: #fff5f5; color: #991b1b; border: 1px solid #fecaca; }
    .notice.hidden { display: none; }

    /* App */
    main.app { max-width: 1100px; margin: 32px auto; padding: 0 24px; }
    .app-hidden { display: none; }

    .card { background: white; border-radius: 12px; box-shadow: var(--shadow-lg); padding: 28px; margin-bottom: 24px; }
    .card h2 { font-size: 18px; font-weight: 900; margin-bottom: 4px; letter-spacing: -0.2px; }
    .card .sub { font-size: 13px; color: var(--gray-600); margin-bottom: 20px; }

    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 14px; align-items: end; }

    /* Table */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--gray-600); padding: 10px 12px; border-bottom: 1.5px solid var(--gray-200); }
    tbody td { padding: 14px 12px; border-bottom: 1px solid var(--gray-200); vertical-align: top; }
    tbody tr:hover { background: var(--gray-100); }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .pill.pending { background: rgba(255,23,68,0.1); color: var(--red); }
    .pill.done { background: rgba(22,163,74,0.1); color: var(--green); }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; }
    .meta-line { color: var(--gray-600); font-size: 12px; margin-top: 3px; }
    .toolbar { display: flex; gap: 8px; }

    @media (max-width: 720px) {
      .row3 { grid-template-columns: 1fr; }
      table { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="top-logo"><img src="logo-light.png" alt="Connectid" /></div>
    <div class="top-right">
      <span id="user-email"></span>
      <a href="#" id="signout" style="display:none;">Sign out</a>
    </div>
  </div>
</header>

<!-- SIGN-IN -->
<div id="signin" class="signin-wrap">
  <div class="signin-card">
    <h1>Intake admin</h1>
    <p>Sign in to create client invitations and review submissions.</p>
    <div id="signin-notice" class="notice hidden"></div>
    <form id="signin-form">
      <div class="field">
        <label>Your email</label>
        <input type="email" id="signin-email" required placeholder="ashley@connectidcrm.com" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signin-btn">Send magic link</button>
    </form>
  </div>
</div>

<!-- APP -->
<main class="app app-hidden" id="app">

  <!-- Create invitation -->
  <div class="card">
    <h2>Invite a new client</h2>
    <p class="sub">Generates a unique intake link. Copy it and email it to the client.</p>
    <div id="create-notice" class="notice hidden"></div>
    <form id="create-form">
      <div class="row3">
        <div class="field"><label>Client name</label><input type="text" id="c-name" required placeholder="Jane Smith" /></div>
        <div class="field"><label>Email</label><input type="email" id="c-email" required placeholder="jane@acmehvac.com" /></div>
        <div class="field"><label>Company</label><input type="text" id="c-company" required placeholder="Acme HVAC" /></div>
        <button type="submit" class="btn btn-primary">Generate link</button>
      </div>
    </form>
  </div>

  <!-- Invitations list -->
  <div class="card">
    <h2>Invitations</h2>
    <p class="sub">Pending and submitted intakes.</p>
    <table>
      <thead>
        <tr>
          <th>Client</th>
          <th>Status</th>
          <th>Created</th>
          <th>Link</th>
        </tr>
      </thead>
      <tbody id="invites-tbody">
        <tr><td colspan="4" style="color:var(--gray-600); text-align:center; padding:24px;">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // =========================================================
  // CONFIG
  // =========================================================
  const SUPABASE_URL = 'https://ihjhfcuiofudkdpinkxo.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImloamhmY3Vpb2Z1ZGtkcGlua3hvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc0NjgxNzQsImV4cCI6MjA5MzA0NDE3NH0.fvnL13SthNvKxCvjAdvintux50YkbL1rgMLSWUUrDEk';
  // Restrict admin access. Set this to YOUR email. Anyone else who signs in will be blocked.
  const ALLOWED_ADMIN_EMAILS = ['ashley@connectidcrm.com'];

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, detectSessionInUrl: true, autoRefreshToken: true },
  });

  const signinEl = document.getElementById('signin');
  const appEl = document.getElementById('app');
  const signinForm = document.getElementById('signin-form');
  const signinBtn = document.getElementById('signin-btn');
  const signinNotice = document.getElementById('signin-notice');
  const signinEmail = document.getElementById('signin-email');
  const userEmail = document.getElementById('user-email');
  const signoutLink = document.getElementById('signout');
  const createForm = document.getElementById('create-form');
  const createNotice = document.getElementById('create-notice');
  const tbody = document.getElementById('invites-tbody');

  function notice(el, type, msg) {
    el.className = 'notice ' + type;
    el.textContent = msg;
  }
  function hide(el) { el.classList.add('hidden'); }

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session?.user?.email && ALLOWED_ADMIN_EMAILS.includes(session.user.email.toLowerCase())) {
      enterApp(session.user.email);
    } else if (session) {
      // Signed in but not allowed
      await supabase.auth.signOut();
      notice(signinNotice, 'err', 'That account is not authorized. Use your admin email.');
    }
  }

  function enterApp(email) {
    signinEl.style.display = 'none';
    appEl.classList.remove('app-hidden');
    userEmail.textContent = email;
    signoutLink.style.display = 'inline';
    loadInvitations();
  }

  signinForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hide(signinNotice);
    const email = signinEmail.value.trim().toLowerCase();
    if (!ALLOWED_ADMIN_EMAILS.includes(email)) {
      notice(signinNotice, 'err', 'That email is not authorized for the admin.');
      return;
    }
    signinBtn.disabled = true;
    signinBtn.textContent = 'Sending…';
    const { error } = await supabase.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: window.location.href.split('#')[0].split('?')[0] },
    });
    signinBtn.disabled = false;
    signinBtn.textContent = 'Send magic link';
    if (error) {
      notice(signinNotice, 'err', error.message);
    } else {
      notice(signinNotice, 'ok', 'Check your email for the sign-in link.');
    }
  });

  signoutLink.addEventListener('click', async (e) => {
    e.preventDefault();
    await supabase.auth.signOut();
    location.reload();
  });

  createForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hide(createNotice);
    const payload = {
      client_name: document.getElementById('c-name').value.trim(),
      client_email: document.getElementById('c-email').value.trim(),
      company_name: document.getElementById('c-company').value.trim(),
    };
    const { data, error } = await supabase
      .from('intake_invitations')
      .insert([payload])
      .select()
      .single();
    if (error) {
      notice(createNotice, 'err', error.message);
      return;
    }
    notice(createNotice, 'ok', `Created. Link: ${intakeUrl(data.token)}`);
    createForm.reset();
    loadInvitations();
  });

  function intakeUrl(token) {
    return `${window.location.origin}/intake.html?token=${token}`;
  }

  async function loadInvitations() {
    const { data, error } = await supabase
      .from('intake_invitations')
      .select('id, token, client_name, client_email, company_name, created_at, submitted_at, intake_id')
      .order('created_at', { ascending: false });

    if (error) {
      tbody.innerHTML = `<tr><td colspan="4" style="color:var(--red); padding:24px; text-align:center;">${error.message}</td></tr>`;
      return;
    }
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="4" style="color:var(--gray-600); text-align:center; padding:24px;">No invitations yet.</td></tr>`;
      return;
    }

    tbody.innerHTML = data.map(row => {
      const url = intakeUrl(row.token);
      const created = new Date(row.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const submitted = row.submitted_at
        ? new Date(row.submitted_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
        : null;
      return `
        <tr>
          <td>
            <strong>${escapeHtml(row.client_name)}</strong> — ${escapeHtml(row.company_name)}
            <div class="meta-line">${escapeHtml(row.client_email)}</div>
          </td>
          <td>
            ${submitted
              ? `<span class="pill done">Submitted</span><div class="meta-line">on ${submitted}</div>`
              : `<span class="pill pending">Pending</span>`}
          </td>
          <td>${created}</td>
          <td>
            <div class="toolbar">
              <button class="btn btn-ghost btn-sm" onclick="copyToClipboard('${url}', this)">Copy link</button>
              ${row.intake_id ? `<button class="btn btn-ghost btn-sm" onclick="viewSubmission('${row.intake_id}')">View</button>` : ''}
            </div>
            <div class="meta-line mono" style="margin-top:6px; word-break:break-all;">${url}</div>
          </td>
        </tr>
      `;
    }).join('');
  }

  window.copyToClipboard = async (text, btn) => {
    try {
      await navigator.clipboard.writeText(text);
      const old = btn.textContent;
      btn.textContent = 'Copied ✓';
      setTimeout(() => btn.textContent = old, 1400);
    } catch (e) {
      alert('Copy failed. URL: ' + text);
    }
  };

  window.viewSubmission = (id) => {
    // Opens Supabase Table Editor filtered to this row
    window.open(`https://supabase.com/dashboard/project/ihjhfcuiofudkdpinkxo/editor?filter=id%3Aeq%3A${id}`, '_blank');
  };

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  // Listen for auth state changes (handles magic link return)
  supabase.auth.onAuthStateChange((_event, session) => {
    if (session?.user?.email && ALLOWED_ADMIN_EMAILS.includes(session.user.email.toLowerCase())) {
      enterApp(session.user.email);
    }
  });

  init();
</script>

</body>
</html>
